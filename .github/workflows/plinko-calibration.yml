name: Plinko calibration

concurrency:
  group: plinko-calibration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - 'simulation/plinko/**'
      - 'src/core/plinko-rules/**'
      - 'balance.v0.json'
      - 'package.json'
      - '.github/workflows/plinko-calibration.yml'

jobs:
  calibration-sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20.19.0
      - run: npm install --no-audit --no-fund
      - run: npm run simulate:plinko:sweep
